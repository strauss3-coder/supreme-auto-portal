const Store = {
  data:null,
  listeners:{},

  init(){
    const saved = DB.read();
    this.data = saved ? this._merge(SEED(),saved) : SEED();
    if(!saved){
      this.log('Portal created','Your Supreme Auto portal is ready to use','sparkles');
      this.persist(true);
    }
  },
  _merge(base,saved){
    const out = Array.isArray(base) ? saved : Object.assign({},base);
    if(Array.isArray(base)) return Array.isArray(saved)?saved:base;
    Object.keys(saved||{}).forEach(k=>{
      const b = base[k], s = saved[k];
      if(b && s && typeof b==='object' && typeof s==='object' && !Array.isArray(b) && !Array.isArray(s)){
        out[k] = Store._merge(b,s);
      }else{
        out[k] = s;
      }
    });
    return out;
  },

  persist(silent){
    this.data.meta.lastSaved = Date.now();
    const ok = DB.write(this.data);
    if(!ok){
      UI.toast('err','Could not save','Browser storage is full. Try removing some images.');
      return false;
    }
    /* mirror the settings documents to Supabase, debounced */
    if(Cloud.on && Cloud.authed){
      clearTimeout(this._st);
      this._st = setTimeout(()=>Cloud.pushSettings(),700);
    }
    if(!silent) UI.savedPing();
    return true;
  },

  /* generic collection helpers ------------------------------------ */
  list(key){ return this.data[key] || []; },
  find(key,id){ return this.list(key).find(r=>r.id===id) || null; },
  insert(key,rec){
    rec.id = rec.id || U.id(key[0]);
    rec.createdAt = rec.createdAt || Date.now();
    rec.updatedAt = Date.now();
    this.data[key].unshift(rec);
    Cloud.pushRecord(key,rec,0);
    this.persist(); this.emit(key);
    return rec;
  },
  update(key,id,patch){
    const rec = this.find(key,id);
    if(!rec) return null;
    Object.assign(rec,patch,{updatedAt:Date.now()});
    Cloud.pushRecord(key,rec,this.list(key).indexOf(rec));
    this.persist(); this.emit(key);
    return rec;
  },
  remove(key,id){
    const i = this.data[key].findIndex(r=>r.id===id);
    if(i<0) return false;
    const rec = this.data[key][i];
    /* clean up any photos this record owned in Storage */
    if(Cloud.on && Cloud.authed){
      const urls = [].concat(rec.images||[],rec.photo||[],rec.image||[]).filter(Boolean);
      urls.forEach(u=>Cloud.removeImage(u));
    }
    this.data[key].splice(i,1);
    Cloud.pushDelete(key,id);
    this.persist(); this.emit(key);
    return true;
  },
  reorder(key,ids){
    const map = {};
    this.list(key).forEach(r=>map[r.id]=r);
    this.data[key] = ids.map(id=>map[id]).filter(Boolean);
    this.list(key).forEach((r,i)=>Cloud.pushRecord(key,r,i));
    this.persist(); this.emit(key);
  },
  patchDoc(key,patch){
    Object.assign(this.data[key],patch);
    this.persist(); this.emit(key);
  },
  /* replaces a whole collection, used by bulk delete and reorder */
  replaceAll(key,list){
    const before = this.list(key).map(r=>r.id);
    this.data[key] = list;
    const after = list.map(r=>r.id);
    before.filter(id=>after.indexOf(id)<0).forEach(id=>Cloud.pushDelete(key,id));
    list.forEach((r,i)=>Cloud.pushRecord(key,r,i));
    this.persist(); this.emit(key);
  },

  /* activity log -------------------------------------------------- */
  log(title,detail,icon,tone){
    this.data.activity = this.data.activity || [];
    const top = this.data.activity[0];
    /* collapse repeat entries so typing in an editor does not flood the log */
    if(top && top.title===title && (Date.now()-top.at) < 120000){
      top.detail = detail; top.at = Date.now();
      Cloud.pushRecord('activity',top,0);
      return;
    }
    const entry = { id:U.id('a'), title, detail, icon:icon||'activity', tone:tone||'', at:Date.now() };
    this.data.activity.unshift(entry);
    Cloud.pushRecord('activity',entry,0);
    if(this.data.activity.length>60) this.data.activity.length = 60;
  },

  /* events -------------------------------------------------------- */
  on(key,fn){ (this.listeners[key] = this.listeners[key]||[]).push(fn); },
  emit(key){
    (this.listeners[key]||[]).forEach(fn=>{try{fn();}catch(e){console.warn(e);}});
    (this.listeners['*']||[]).forEach(fn=>{try{fn();}catch(e){console.warn(e);}});
  },

  /* derived stats -------------------------------------------------- */
  stats(){
    const v = this.list('vehicles').filter(x=>!x.archived);
    const all = this.list('vehicles');
    return {
      total:v.length,
      available:v.filter(x=>!x.sold && !x.reserved).length,
      sold:all.filter(x=>x.sold).length,
      reserved:v.filter(x=>x.reserved && !x.sold).length,
      featured:v.filter(x=>x.featured && !x.sold).length,
      archived:all.filter(x=>x.archived).length,
      gallery:this.list('gallery').length,
      testimonials:this.list('testimonials').length,
      offersOn:this.list('offers').filter(o=>o.active).length,
      unread:this.list('enquiries').filter(e=>e.status==='unread').length,
      enquiries:this.list('enquiries').length,
      stockValue:v.filter(x=>!x.sold).reduce((s,x)=>s+(Number(x.price)||0),0),
      views:v.reduce((s,x)=>s+(Number(x.views)||0),0)
    };
  }
};

/* ==================================================================
   5. UI  -  toasts, modal, confirm, lightbox, sortable, uploader
   ================================================================== */
const UI = {
  /* Counted, because a confirm often opens on top of an editor. The lock
     only lifts when the last overlay has gone. */
  _locks:0,
  /* Binds a click handler that cannot run twice. A destructive or
     record-creating button stays inert until its work finishes, so a
     double tap -- common on touch, and easy on a slow save -- cannot
     insert the same record twice or fire two deletes. */
  once(el,fn){
    if(!el) return;
    let busy = false;
    el.addEventListener('click',async e=>{
      if(busy) return;
      busy = true;
      el.disabled = true;
      try{ await fn(e); }
      catch(err){ console.warn(err); }
      finally{
        busy = false;
        if(el.isConnected) el.disabled = false;
      }
    });
  },
  _lock(d){
    UI._locks = Math.max(0, UI._locks + d);
    document.body.style.overflow = UI._locks ? 'hidden' : '';
  },
  toast(type,title,msg){
    const wrap = U.el('#toasts');
    const ic = type==='ok' ? `<svg class="check-anim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>`
      : type==='err' ? ICON.x : type==='warn' ? ICON.warn : ICON.info;
    const t = document.createElement('div');
    t.className = 'toast '+type;
    t.innerHTML = `<div class="toast-ic">${ic}</div><div style="min-width:0"><b>${U.esc(title)}</b>${msg?`<small>${U.esc(msg)}</small>`:''}</div>`;
    wrap.appendChild(t);
    setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),320); }, type==='err'?4600:2900);
  },
  savedPing(){
    clearTimeout(UI._pt);
    UI._pt = setTimeout(()=>UI.toast('ok','Saved','All changes are stored automatically'),120);
  },

  modal(opts){
    const root = U.el('#modalRoot');
    const scrim = document.createElement('div');
    scrim.className='modal-scrim';
    scrim.innerHTML = `
      <div class="modal ${opts.size||''}" role="dialog" aria-modal="true">
        <div class="modal-h">
          <div style="min-width:0">
            <h3>${U.esc(opts.title||'')}</h3>
            ${opts.sub?`<p>${U.esc(opts.sub)}</p>`:''}
          </div>
          <button class="x" data-close aria-label="Close">${ICON.x}</button>
        </div>
        <div class="modal-b">${opts.body||''}</div>
        ${opts.footer===false?'':`<div class="modal-f">${opts.footer||''}</div>`}
      </div>`;
    root.appendChild(scrim);
    requestAnimationFrame(()=>scrim.classList.add('on'));
    const opener = document.activeElement;
    UI._lock(1);
    let closed = false;
    const close = ()=>{
      /* Guard against a second call. Escape, the X, the scrim and a caller
         doing its own close() can all land, and onClose must fire once. */
      if(closed) return;
      closed = true;
      scrim.classList.remove('on');
      scrim.classList.add('closing');
      setTimeout(()=>scrim.remove(),320);
      document.removeEventListener('keydown',esc);
      UI._lock(-1);
      if(opener && opener.focus) { try{ opener.focus(); }catch(e){} }
      if(opts.onClose) opts.onClose();
    };
    const esc = e=>{ if(e.key==='Escape') close(); };
    document.addEventListener('keydown',esc);
    scrim.addEventListener('click',e=>{ if(e.target===scrim) close(); });
    U.els('[data-close]',scrim).forEach(b=>b.addEventListener('click',close));
    const api = { el:scrim, node:U.el('.modal',scrim), body:U.el('.modal-b',scrim), footer:U.el('.modal-f',scrim), close };
    if(opts.onMount) opts.onMount(api);
    setTimeout(()=>{ const f = U.el('input:not([type=file]),textarea,select',scrim); if(f && opts.autofocus!==false) f.focus(); },340);
    return api;
  },

  confirm(opts){
    return new Promise(resolve=>{
      const tone = opts.tone||'dan';
      const m = UI.modal({
        size:'sm', title:opts.title||'Are you sure?', autofocus:false,
        body:`<div class="note ${tone==='dan'?'dan':tone==='warn'?'warn':''}" style="align-items:flex-start">
                ${tone==='dan'?ICON.warn:ICON.info}
                <div>${U.esc(opts.message||'')}</div>
              </div>`,
        footer:`<button class="btn" data-close>Cancel</button>
                <div class="sp"><button class="btn btn-${tone==='dan'?'dan':'pri'}" data-yes>${U.esc(opts.confirmText||'Confirm')}</button></div>`,
        onClose:()=>resolve(false)
      });
      U.el('[data-yes]',m.el).addEventListener('click',()=>{ resolve(true); m.close(); });
    });
  },

  lightbox(src){
    const root = U.el('#lightboxRoot');
    const box = document.createElement('div');
    box.className='lightbox';
    box.innerHTML = `<button class="x">${ICON.x}</button><img src="${src}" alt="Preview">`;
    root.appendChild(box);
    const opener = document.activeElement;
    UI._lock(1);
    let gone = false;
    const close = ()=>{
      if(gone) return;
      gone = true;
      box.remove();
      document.removeEventListener('keydown',onKey);
      UI._lock(-1);
      if(opener && opener.focus) { try{ opener.focus(); }catch(e){} }
    };
    const onKey = e=>{ if(e.key==='Escape') close(); };
    box.addEventListener('click',e=>{ if(e.target===box || e.target.closest('.x')) close(); });
    document.addEventListener('keydown',onKey);
  },

  /* animated counters --------------------------------------------- */
  countUp(node){
    const target = Number(node.dataset.count)||0;
    const prefix = node.dataset.prefix||'';
    const suffix = node.dataset.suffix||'';
    const dur = 850;
    const t0 = performance.now();
    const step = now=>{
      const p = U.clamp((now-t0)/dur,0,1);
      const eased = 1-Math.pow(1-p,3);
      const val = Math.round(target*eased);
      node.textContent = prefix + val.toLocaleString('en-ZA') + suffix;
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },
  animateAll(root){
    U.els('[data-count]',root).forEach((n,i)=>setTimeout(()=>UI.countUp(n),i*60));
    U.els('.stat',root).forEach((n,i)=>n.style.animationDelay=(i*55)+'ms');
    U.els('.veh',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*45,500)+'ms');
    U.els('.tst',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*55,500)+'ms');
    U.els('.list-item',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*35,420)+'ms');
    U.els('.meter i',root).forEach(n=>{ const w=n.dataset.w||'0%'; n.style.width='0%'; setTimeout(()=>n.style.width=w,90); });
    U.els('.bar',root).forEach((n,i)=>n.style.animationDelay=(i*55)+'ms');
  },

  /* drag to reorder ----------------------------------------------- */
  sortable(container,itemSel,onDrop){
    let dragEl = null;
    U.els(itemSel,container).forEach(el=>{
      el.setAttribute('draggable','true');
      el.addEventListener('dragstart',e=>{
        dragEl = el; el.classList.add('drag');
        e.dataTransfer.effectAllowed='move';
        try{ e.dataTransfer.setData('text/plain',el.dataset.id||''); }catch(err){}
      });
      el.addEventListener('dragend',()=>{
        el.classList.remove('drag');
        U.els(itemSel,container).forEach(x=>x.classList.remove('overdrop'));
        dragEl=null;
        onDrop(U.els(itemSel,container).map(x=>x.dataset.id));
      });
      el.addEventListener('dragover',e=>{
        e.preventDefault();
        if(!dragEl || dragEl===el) return;
        el.classList.add('overdrop');
        const items = U.els(itemSel,container);
        if(items.indexOf(dragEl) < items.indexOf(el)) el.after(dragEl);
        else el.before(dragEl);
      });
      el.addEventListener('dragleave',()=>el.classList.remove('overdrop'));
    });
  },

  /* image uploader ------------------------------------------------
     Renders a drop zone plus reorderable thumbnails. Calls onChange
     with the new array of data URLs. Works on desktop and mobile. */
  uploader(host,opts){
    const cfg = Object.assign({ max:5, images:[], label:'Drop images here or tap to browse', hint:'', square:false }, opts);
    let imgs = cfg.images.slice();
    const inputId = U.id('file');

    function paint(){
      const full = imgs.length>=cfg.max;
      host.innerHTML = `
        <div class="drop ${full?'':''}" data-pick style="${full?'opacity:.5;pointer-events:none':''}">
          ${ICON.upload}
          <b>${U.esc(cfg.label)}</b>
          <small>${full?`Maximum of ${cfg.max} images reached`:`${imgs.length} of ${cfg.max} used. JPG or PNG. ${U.esc(cfg.hint)}`}</small>
        </div>
        <input type="file" id="${inputId}" accept="image/*" multiple class="hidden">
        <div class="prog hidden" data-prog><i></i></div>
        ${imgs.length?`<div class="${cfg.square?'gal':'thumbs'}" data-thumbs>${imgs.map((src,i)=>`
          <div class="thumb" data-id="${i}" data-idx="${i}">
            <img src="${src}" alt="Image ${i+1}" loading="lazy">
            ${i===0&&!cfg.square?`<span class="pri">Main</span>`:''}
            <span class="ord">${i+1}</span>
            <div class="tb">
              <button data-act="view" title="Preview">${ICON.eye}</button>
              <button data-act="replace" title="Replace">${ICON.refresh}</button>
              <button data-act="left" title="Move left">${ICON.sort}</button>
              <button data-act="del" class="dan" title="Delete">${ICON.trash}</button>
            </div>
          </div>`).join('')}</div>`:''}
      `;
      wire();
    }

    async function addFiles(fileList,replaceIdx){
      const files = Array.prototype.slice.call(fileList).filter(f=>/^image\//.test(f.type));
      if(!files.length) return UI.toast('warn','No images found','Please choose JPG or PNG files.');
      const room = replaceIdx==null ? cfg.max-imgs.length : 1;
      const use = files.slice(0,room);
      if(files.length>room) UI.toast('warn','Some images skipped',`Only ${cfg.max} images are allowed.`);
      const prog = U.el('[data-prog]',host);
      prog.classList.remove('hidden');
      const bar = U.el('i',prog);
      for(let i=0;i<use.length;i++){
        try{
          let url = await U.readImage(use[i]);
          url = await Assets.put(url,cfg.bucket);          /* to Storage when connected */
          if(replaceIdx!=null){
            const old = imgs[replaceIdx];
            imgs[replaceIdx] = url;
            Cloud.removeImage(old);
          } else imgs.push(url);
        }catch(err){ UI.toast('err','Upload failed',err.message); }
        bar.style.width = Math.round(((i+1)/use.length)*100)+'%';
      }
      setTimeout(()=>{
        paint();
        cfg.onChange(imgs.slice());
        UI.toast('ok', replaceIdx!=null?'Image replaced':'Images added', imgs.length+' of '+cfg.max+' in use');
      },260);
    }

    function wire(){
      const drop = U.el('[data-pick]',host);
      const input = U.el('#'+inputId,host);
      let replaceIdx = null;
      drop.addEventListener('click',()=>{ replaceIdx=null; input.click(); });
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
      drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files,null); });
      input.addEventListener('change',()=>{ if(input.files.length) addFiles(input.files,replaceIdx); input.value=''; });

      const thumbs = U.el('[data-thumbs]',host);
      if(!thumbs) return;
      U.on(thumbs,'click','[data-act]',(e,btn)=>{
        e.preventDefault(); e.stopPropagation();
        const idx = Number(btn.closest('.thumb').dataset.idx);
        const act = btn.dataset.act;
        if(act==='view') UI.lightbox(imgs[idx]);
        if(act==='del'){
          const gone = imgs[idx];
          imgs.splice(idx,1); paint(); cfg.onChange(imgs.slice());
          Cloud.removeImage(gone);
          UI.toast('info','Image removed','');
        }
        if(act==='left'){
          const to = idx===0 ? imgs.length-1 : idx-1;
          const [m] = imgs.splice(idx,1); imgs.splice(to,0,m);
          paint(); cfg.onChange(imgs.slice());
        }
        if(act==='replace'){ replaceIdx = idx; input.click(); }
      });
      UI.sortable(thumbs,'.thumb',order=>{
        const next = order.map(i=>imgs[Number(i)]).filter(Boolean);
        if(next.length===imgs.length){ imgs = next; paint(); cfg.onChange(imgs.slice()); }
      });
    }

    paint();
    return { get:()=>imgs.slice(), set:v=>{imgs=v.slice();paint();} };
  },

  /* single image picker (logo, avatar, banner) --------------------- */
  imagePicker(host,opts){
    const cfg = Object.assign({ value:'', label:'Upload image', h:120, round:false, max:1200 },opts);
    let val = cfg.value;
    const inputId = U.id('f');
    function paint(){
      host.innerHTML = `
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <div data-pick style="width:${cfg.round?cfg.h+'px':'auto'};min-width:110px;height:${cfg.h}px;flex-shrink:0;border-radius:${cfg.round?'50%':'var(--r-md)'};overflow:hidden;border:1.6px dashed var(--line-2);background:var(--glass);display:grid;place-items:center;cursor:pointer;position:relative">
            ${val?`<img src="${val}" style="width:100%;height:100%;object-fit:cover">`
                 :`<div style="text-align:center;color:var(--text-3);font-size:11.5px;padding:8px">
                      <div style="display:grid;place-items:center;margin-bottom:4px">${ICON.image}</div>${U.esc(cfg.label)}</div>`}
          </div>
          <div class="row" style="gap:8px">
            <button class="btn btn-sm" data-pick>${ICON.upload} ${val?'Replace':'Upload'}</button>
            ${val?`<button class="btn btn-sm btn-ghost" data-view>${ICON.eye} Preview</button>
                   <button class="btn btn-sm btn-dan" data-clear>${ICON.trash} Remove</button>`:''}
          </div>
        </div>
        <input type="file" id="${inputId}" accept="image/*" class="hidden">`;
      const input = U.el('#'+inputId,host);
      U.els('[data-pick]',host).forEach(b=>b.addEventListener('click',()=>input.click()));
      input.addEventListener('change',async()=>{
        const f = input.files[0]; input.value='';
        if(!f) return;
        try{
          const old = val;
          val = await U.readImage(f,cfg.max);
          val = await Assets.put(val,cfg.bucket||'branding');
          paint(); cfg.onChange(val);
          Cloud.removeImage(old);
          UI.toast('ok','Image uploaded','');
        }catch(err){ UI.toast('err','Upload failed',err.message); }
      });
      const v = U.el('[data-view]',host); if(v) v.addEventListener('click',()=>UI.lightbox(val));
      const c = U.el('[data-clear]',host);
      if(c) c.addEventListener('click',()=>{ const gone=val; val=''; paint(); cfg.onChange(''); Cloud.removeImage(gone); UI.toast('info','Image removed',''); });
    }
    paint();
    return { get:()=>val };
  },

  /* tag input ----------------------------------------------------- */
  tags(host,values,onChange){
    let list = (values||[]).slice();
    function paint(){
      host.innerHTML = `<div class="tag-in">
        ${list.map((t,i)=>`<span class="tag">${U.esc(t)}<button data-i="${i}" aria-label="Remove">${ICON.x}</button></span>`).join('')}
        <input placeholder="${list.length?'Add another feature':'Type a feature and press Enter'}">
      </div>`;
      const inp = U.el('input',host);
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter' || e.key===','){
          e.preventDefault();
          const v = inp.value.trim();
          if(v && list.indexOf(v)<0){ list.push(v); paint(); onChange(list.slice()); U.el('input',host).focus(); }
        }
        if(e.key==='Backspace' && !inp.value && list.length){ list.pop(); paint(); onChange(list.slice()); U.el('input',host).focus(); }
      });
      U.on(host,'click','button[data-i]',(e,b)=>{ list.splice(Number(b.dataset.i),1); paint(); onChange(list.slice()); });
    }
    paint();
    return { get:()=>list.slice() };
  },

  skeleton(kind,n=6){
    if(kind==='cards') return `<div class="veh-grid">${Array(n).fill('<div class="sk sk-card"></div>').join('')}</div>`;
    if(kind==='stats') return `<div class="stats">${Array(4).fill('<div class="sk" style="height:112px;border-radius:var(--r-lg)"></div>').join('')}</div>`;
    return `<div class="grid" style="gap:10px">${Array(n).fill('<div class="sk sk-line"></div>').join('')}</div>`;
  }
};

const H = {
  stat(o){
    return `<div class="stat">
      <div class="stat-top">
        <div class="stat-ic ${o.tone||''}">${ICON[o.icon]||ICON.activity}</div>
        <div style="min-width:0"><div class="stat-lab">${U.esc(o.label)}</div></div>
      </div>
      <div class="stat-val" ${o.count!=null?`data-count="${o.count}" data-prefix="${o.prefix||''}" data-suffix="${o.suffix||''}"`:''}>${o.count!=null?'0':U.esc(o.value)}</div>
      ${o.sub?`<div class="stat-sub">${o.sub}</div>`:''}
    </div>`;
  },
  card(title,sub,bodyHtml,actions,bodyClass){
    return `<div class="card">
      ${title?`<div class="card-h"><div style="min-width:0"><h3>${U.esc(title)}</h3>${sub?`<p>${U.esc(sub)}</p>`:''}</div>${actions?`<div class="sp">${actions}</div>`:''}</div>`:''}
      <div class="card-b ${bodyClass||''}">${bodyHtml}</div>
    </div>`;
  },
  head(title,sub,actions){
    return `<div class="page-head">
      <div><h2>${U.esc(title)}</h2><p>${U.esc(sub)}</p></div>
      ${actions?`<div class="sp">${actions}</div>`:''}
    </div>`;
  },
  empty(icon,title,text,action){
    return `<div class="empty">
      <div class="empty-ic">${ICON[icon]||ICON.inbox}</div>
      <b>${U.esc(title)}</b><p>${U.esc(text)}</p>
      ${action||''}
    </div>`;
  },
  field(label,inner,hint,note){
    return `<div class="field">
      <label>${U.esc(label)}${note?` <em>${U.esc(note)}</em>`:''}</label>
      ${inner}
      ${hint?`<span class="hint">${U.esc(hint)}</span>`:''}
    </div>`;
  },
  input(key,val,ph,type){
    return `<input class="inp" data-k="${key}" type="${type||'text'}" value="${U.esc(val)}" placeholder="${U.esc(ph||'')}">`;
  },
  ta(key,val,ph,rows){
    return `<textarea class="ta" data-k="${key}" rows="${rows||4}" placeholder="${U.esc(ph||'')}">${U.esc(val)}</textarea>`;
  },
  sel(key,val,opts){
    return `<select class="sel" data-k="${key}">${opts.map(o=>{
      const v = typeof o==='object'?o.v:o, l = typeof o==='object'?o.l:o;
      return `<option value="${U.esc(v)}" ${String(v)===String(val)?'selected':''}>${U.esc(l)}</option>`;
    }).join('')}</select>`;
  },
  sw(key,on,label,sub,tone){
    return `<label class="switch ${tone||''}">
      <input type="checkbox" data-k="${key}" ${on?'checked':''}>
      <span class="track"></span>
      <span><b>${U.esc(label)}</b>${sub?`<small>${U.esc(sub)}</small>`:''}</span>
    </label>`;
  },
  toggleCard(key,on,label,sub,tone,icon){
    return `<div class="toggle-card">
      ${icon?`<div class="li-ic ${tone==='ok'?'ok':tone==='warn'?'warn':'acc'}">${ICON[icon]}</div>`:''}
      <div style="min-width:0"><b style="font-size:13px">${U.esc(label)}</b>${sub?`<small style="display:block;font-size:11.5px;color:var(--text-3)">${U.esc(sub)}</small>`:''}</div>
      <label class="switch ${tone||''}"><input type="checkbox" data-k="${key}" ${on?'checked':''}><span class="track"></span></label>
    </div>`;
  },
  /* binds every [data-k] control inside root to a save function */
  bind(root,getVal,onSave){
    const push = U.debounce(()=>onSave(),450);
    U.els('[data-k]',root).forEach(el=>{
      const k = el.dataset.k;
      const handler = ()=>{
        let v = el.type==='checkbox' ? el.checked : el.value;
        if(el.dataset.type==='number' || el.type==='number') v = Number(v)||0;
        getVal(k,v,el);
        if(el.type==='checkbox' || el.tagName==='SELECT' || el.type==='date' || el.type==='color') onSave();
        else push();
      };
      el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',handler);
      if(el.type==='color'||el.type==='date') el.addEventListener('change',handler);
    });
  }
};

Portal.register({
  id:'offers', title:'Special Offers', sub:'Promotional banners', icon:'tag', group:'Website', instant:true,
  badge(st){ return st.offersOn ? {text:String(st.offersOn)} : null; },
  render(){
    const list = Store.list('offers');
    return `
    ${H.head('Special Offers','Create promotional banners for finance deals, trade-in bonuses and monthly specials.',
      `<button class="btn btn-pri" data-act="add">${ICON.plus} Create offer</button>`)}
    ${list.length ? `<div class="grid g2" style="align-items:start">${list.map(o=>{
      const expired = o.expiry && o.expiry < Date.now();
      const days = o.expiry ? Math.ceil((o.expiry-Date.now())/86400000) : null;
      return `<div class="card lift" data-id="${o.id}">
        <div class="card-b">
          <div class="offer-prev" style="background:linear-gradient(140deg,${o.colour}, ${o.colour}22);${o.active&&!expired?'':'filter:grayscale(.7);opacity:.75'}">
            ${o.image?`<div class="bgimg" style="background-image:url('${o.image}')"></div>`:''}
            <h4>${U.esc(o.title)}</h4>
            <p>${U.esc(o.description)}</p>
            ${o.btnText?`<span class="btn btn-sm" style="background:#fff;color:#111;border-color:transparent;font-weight:700">${U.esc(o.btnText)}</span>`:''}
          </div>
          <div class="row" style="margin-top:14px">
            <span class="chip ${expired?'dan':o.active?'ok':''}"><i></i>${expired?'Expired':o.active?'Live on website':'Switched off'}</span>
            ${o.demo?`<span class="chip dan">Sample</span>`:''}
            ${o.expiry?`<span class="chip">${ICON.calendar} ${expired?'Ended '+U.date(o.expiry):days+' days left'}</span>`:''}
          </div>
        </div>
        <div class="veh-acts">
          <button class="btn btn-sm" data-oact="edit" data-id="${o.id}">${ICON.edit} Edit</button>
          <button class="btn btn-sm ${o.active?'btn-warn':'btn-ok'}" data-oact="toggle" data-id="${o.id}">${o.active?ICON.x+' Switch off':ICON.check+' Switch on'}</button>
          <button class="btn btn-sm" data-oact="dup" data-id="${o.id}">${ICON.copy}</button>
          <button class="btn btn-sm btn-dan" data-oact="del" data-id="${o.id}">${ICON.trash}</button>
        </div>
      </div>`;
    }).join('')}</div>`
    : H.empty('tag','No offers yet','Create your first promotional banner to highlight a finance deal or monthly special.',
        `<button class="btn btn-pri" data-act="add" style="margin-top:4px">${ICON.plus} Create offer</button>`)}`;
  },
  mount(root){
    U.on(root,'click','[data-act="add"]',()=>Modules.offerForm(null));
    U.on(root,'click','[data-oact]',U.guard(async(e,b)=>{
      const o = Store.find('offers',b.dataset.id);
      if(!o) return;
      const act = b.dataset.oact;
      if(act==='edit') return Modules.offerForm(o.id);
      if(act==='toggle'){
        Store.update('offers',o.id,{active:!o.active});
        Store.log('Offer '+(o.active?'switched on':'switched off'),o.title,'tag',o.active?'ok':'warn');
        Router.refresh(); UI.toast('ok',o.active?'Offer is live':'Offer switched off','');
      }
      if(act==='dup'){
        const copy = Object.assign({},o,{id:U.id('o'),title:o.title+' (copy)',active:false,createdAt:Date.now()});
        Store.insert('offers',copy);
        Router.refresh(); UI.toast('ok','Offer duplicated','');
      }
      if(act==='del'){
        if(await UI.confirm({title:'Delete this offer?',message:'"'+o.title+'" will be removed from your website.',confirmText:'Delete offer'})){
          Store.remove('offers',o.id);
          Store.log('Offer deleted',o.title,'trash','dan');
          Router.refresh(); UI.toast('ok','Offer deleted','');
        }
      }
    }));
  }
});

      if(k.indexOf('social.')===0) c.social[k.split('.')[1]] = v;
      else c[k] = v;
    },()=>{ Store.persist(); Store.log('Contact details updated','Your contact information was changed','phone'); });
    U.els('[data-hi]',root).forEach(el=>el.addEventListener('change',()=>{
      c.hours[Number(el.dataset.hi)][el.dataset.hk] = el.value;
      Store.persist(); Router.refresh();
    }));
    U.on(root,'change','[data-hopen]',(e,cb)=>{
      const h = c.hours[Number(cb.dataset.hopen)];
      h.closed = !cb.checked;
      if(!h.closed && !h.open){ h.open='08:00'; h.close='17:00'; }
      Store.persist(); Router.refresh();
    });
    U.on(root,'click','[data-act="test"]',()=>{
      const n = (c.whatsapp||'').replace(/[^0-9]/g,'');
      if(!n) return UI.toast('warn','No WhatsApp number','Add your WhatsApp number first.');
      window.open('https://wa.me/'+n,'_blank','noopener');
    });
  }
});

   MODULE: Enquiries
   ================================================================== */
Portal.register({
  id:'enquiries', title:'Enquiries', sub:'Leads from your website', icon:'inbox', group:'Customers', instant:true,
  badge(st){ return st.unread ? {text:String(st.unread)} : null; },
  state:{ tab:'all', q:'' },
  render(){
    const s = this.state;
    const all = Store.list('enquiries');
    const counts = {
      all:all.length,
      unread:all.filter(e=>e.status==='unread').length,
      contacted:all.filter(e=>e.status==='contacted').length,
      completed:all.filter(e=>e.status==='completed').length
    };
    let list = s.tab==='all' ? all.slice() : all.filter(e=>e.status===s.tab);
    if(s.q){
      const q = s.q.toLowerCase();
      list = list.filter(e=>[e.name,e.phone,e.email,e.vehicle,e.message].join(' ').toLowerCase().indexOf(q)>=0);
    }
    list.sort((a,b)=>b.createdAt-a.createdAt);

    return `
    ${H.head('Enquiries','Every message from your website, WhatsApp and phone in one place.',`
      <button class="btn" data-act="export">${ICON.download} Export CSV</button>
      <button class="btn btn-pri" data-act="add">${ICON.plus} Log an enquiry</button>`)}

    <div class="stats" style="margin-bottom:18px">
      ${H.stat({label:'Unread',count:counts.unread,icon:'inbox',tone:counts.unread?'dan':'ok',sub:'<span>Need a reply</span>'})}
      ${H.stat({label:'Contacted',count:counts.contacted,icon:'phone',tone:'warn',sub:'<span>In progress</span>'})}
      ${H.stat({label:'Completed',count:counts.completed,icon:'checkCircle',tone:'ok',sub:'<span>Closed off</span>'})}
      ${H.stat({label:'Total enquiries',count:counts.all,icon:'users',sub:'<span>All time</span>'})}
    </div>

    <div class="filters">
      <label class="search">${ICON.search}<input id="eq" placeholder="Search by name, number or vehicle" value="${U.esc(s.q)}"></label>
      <div class="segbar">
        ${[['all','All'],['unread','Unread'],['contacted','Contacted'],['completed','Completed']]
          .map(t=>`<button data-etab="${t[0]}" class="${s.tab===t[0]?'on':''}">${t[1]}<span class="n">${counts[t[0]]}</span></button>`).join('')}
      </div>
    </div>

    ${list.length ? `<div class="card"><div class="card-b flush"><div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Customer</th><th>Vehicle</th><th>Contact</th><th>Received</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>
          ${list.map(e=>`<tr class="${e.status==='unread'?'unread':''}" data-eopen="${e.id}" style="cursor:pointer">
            <td>
              <div style="display:flex;align-items:center;gap:10px">
                <div class="avatar" style="width:30px;height:30px;font-size:11px">${U.esc(U.initials(e.name))}</div>
                <div style="min-width:0"><b>${U.esc(e.name)}</b><div class="mut">${e.demo?'Sample record':U.esc(e.source||'Website')}</div></div>
              </div>
            </td>
            <td><span class="chip">${ICON.car} ${U.esc(e.vehicle||'General enquiry')}</span></td>
            <td><div>${U.esc(e.phone||'')}</div><div class="mut">${U.esc(e.email||'')}</div></td>
            <td><div>${U.ago(e.createdAt)}</div><div class="mut">${U.dateTime(e.createdAt)}</div></td>
            <td><span class="chip ${e.status==='unread'?'acc':e.status==='contacted'?'warn':'ok'}"><i></i>${e.status.charAt(0).toUpperCase()+e.status.slice(1)}</span></td>
            <td>
              <div class="row" style="justify-content:flex-end;gap:5px;flex-wrap:nowrap">
                <button class="btn btn-sm btn-icon" data-eact="view" data-id="${e.id}" title="Open">${ICON.eye}</button>
                <button class="btn btn-sm btn-icon" data-eact="wa" data-id="${e.id}" title="Reply on WhatsApp">${ICON.whatsapp}</button>
                <button class="btn btn-sm btn-icon" data-eact="mail" data-id="${e.id}" title="Reply by email">${ICON.mail}</button>
                <button class="btn btn-sm btn-icon btn-dan" data-eact="del" data-id="${e.id}" title="Delete">${ICON.trash}</button>
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div></div></div>`
    : H.empty('inbox', s.q?'No enquiries match your search':'No enquiries here yet',
        s.q?'Try a different name, number or vehicle.':'When a customer sends a message from your website it will appear in this list.')}`;
  },
  mount(root){
    const s = this.state;
    const q = U.el('#eq',root);
    if(q) q.addEventListener('input',U.debounce(()=>{ s.q=q.value; Router.refresh(); },260));
    U.on(root,'click','[data-etab]',(e,b)=>{ s.tab=b.dataset.etab; Router.refresh(); });
    U.on(root,'click','[data-act="export"]',()=>Modules.exportEnquiries());
    U.on(root,'click','[data-act="add"]',()=>Modules.enquiryForm());
    U.on(root,'click','[data-eopen]',(e,tr)=>{ if(!e.target.closest('[data-eact]')) Modules.enquiryView(tr.dataset.eopen); });
    U.on(root,'click','[data-eact]',U.guard(async(e,b)=>{
      e.stopPropagation();
      const en = Store.find('enquiries',b.dataset.id);
      if(!en) return;
      const act = b.dataset.eact;
      if(act==='view') return Modules.enquiryView(en.id);
      if(act==='wa'){
        const n = (en.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'27');
        if(!n) return UI.toast('warn','No phone number','This enquiry has no number saved.');
        window.open('https://wa.me/'+n+'?text='+encodeURIComponent('Good day '+en.name.split(' ')[0]+', thank you for your enquiry about the '+(en.vehicle||'vehicle')+' at Supreme Auto.'),'_blank','noopener');
        if(en.status==='unread'){ Store.update('enquiries',en.id,{status:'contacted'}); Router.refresh(); }
      }
      if(act==='mail'){
        if(!en.email) return UI.toast('warn','No email address','This enquiry has no email saved.');
        window.location.href = 'mailto:'+en.email+'?subject='+encodeURIComponent('Your enquiry about the '+(en.vehicle||'vehicle'))+'&body='+encodeURIComponent('Good day '+en.name.split(' ')[0]+',\n\nThank you for your enquiry at Supreme Auto.\n\n');
        if(en.status==='unread'){ Store.update('enquiries',en.id,{status:'contacted'}); Router.refresh(); }
      }
      if(act==='del'){
        if(await UI.confirm({title:'Delete this enquiry?',message:'The message from '+en.name+' will be permanently removed.',confirmText:'Delete enquiry'})){
          Store.remove('enquiries',en.id);
          Store.log('Enquiry deleted','Message from '+en.name+' was removed','trash','dan');
          Router.refresh(); UI.toast('ok','Enquiry deleted','');
        }
      }
    }));
  }
});

            <button class="btn btn-block" id="btnSignOut2">${ICON.shield} Sign out of the portal</button>
            <div class="note">${ICON.info}<div>There is no local portal password any more. Access is controlled entirely by your Supabase account and the owner allowlist, so losing this file does not expose your data.</div></div>
          </div>`)}

        ${H.card('Danger zone','Actions here cannot be undone',`
          <div class="grid" style="gap:10px">
            <button class="btn btn-dan btn-block" data-act="clearenq">${ICON.inbox} Delete all enquiries</button>
            <button class="btn btn-dan btn-block" data-act="clearveh">${ICON.car} Delete all vehicles</button>
            <button class="btn btn-dan btn-block" data-act="reset">${ICON.warn} Reset entire portal</button>
            <div class="note dan">${ICON.warn}<div>Resetting returns the portal to its starting content. Download a backup first if you might want your data back.</div></div>

        ${H.card('Connecting a database','How to go live with real data later',`
          <div class="grid" style="gap:12px">
            <div class="note ok">${ICON.db}<div>This portal is already connected to Supabase, and Supabase is the only way in. Content lives in the database, photos in Storage, and your sign in is a real Supabase account. The four functions below are the local cache that keeps the portal working when the signal drops.</div></div>

      </div>

  mount(root){

    U.on(root,'change','[data-k="siteLive"]',(e,cb)=>{
      m.siteLive = cb.checked; Store.persist();
      Store.log(cb.checked?'Website switched on':'Website switched off',cb.checked?'Visitors can browse normally':'Visitors see a maintenance notice','globe',cb.checked?'ok':'warn');
      Router.refresh(); UI.toast(cb.checked?'ok':'warn',cb.checked?'Website is live':'Website is offline','');
    });
    U.on(root,'click','[data-act="export"]',()=>Modules.exportAll());
    U.on(root,'click','[data-act="import"]',()=>U.el('#impFile',root).click());
    U.el('#impFile',root).addEventListener('change',e=>Modules.importAll(e.target.files[0]));
    U.on(root,'click','[data-act="csvveh"]',()=>Modules.exportVehicles());
    U.on(root,'click','[data-act="csvenq"]',()=>Modules.exportEnquiries());
    U.on(root,'click','[data-act="csvtst"]',()=>Modules.exportTestimonials());

      const btn = U.el('#pwSave',root);

      err.textContent = ''; btn.disabled = true;

        await Cloud.updatePassword(n);
        U.el('#pwNew',root).value=''; U.el('#pwNew2',root).value='';

      if(await UI.confirm({title:'Delete all vehicles?',message:'Every vehicle and its photos will be removed from your website.',confirmText:'Delete all vehicles'})){

        Store.log('All vehicles deleted','The stock list was cleared','trash','dan');
        Router.refresh(); UI.toast('ok','Vehicles deleted','');
      }
    }));
    U.on(root,'click','[data-act="reset"]',U.guard(async()=>{
      if(await UI.confirm({title:'Reset the entire portal?',message:'All of your content, settings and images will be replaced with the starting sample data. This cannot be undone.',confirmText:'Reset everything'})){
        DB.clear(); Store.init(); Shell.applyTheme(); Router.buildNav(); Router.go('dashboard');
        UI.toast('ok','Portal reset','Everything is back to the starting content');
      }
    }));
  }
});

create or replace function public.touch_updated_at()
returns trigger
language plpgsql
as $$
begin
  new.updated_at = now();
  return new;
end;
$$;

do $$
declare t text;
begin
  foreach t in array array['site_settings','vehicles','testimonials','offers','enquiries']
  loop
    execute format('drop trigger if exists touch_%1$s on public.%1$s', t);
    execute format(
      'create trigger touch_%1$s before update on public.%1$s
       for each row execute function public.touch_updated_at()', t);
  end loop;
end $$;

  email     text,
  added_at  timestamptz not null default now()
);

alter table public.portal_owners enable row level security;

create or replace function public.is_owner()
returns boolean
language sql
stable
security definer
set search_path = public
as $$
  select exists (
    select 1 from public.portal_owners where user_id = auth.uid()
  );
$$;

revoke all on function public.is_owner() from public, anon;
grant execute on function public.is_owner() to authenticated;

alter table public.site_settings enable row level security;
alter table public.vehicles      enable row level security;
alter table public.testimonials  enable row level security;
alter table public.offers        enable row level security;
alter table public.enquiries     enable row level security;
alter table public.activity_log  enable row level security;

do $$

begin

    select schemaname, tablename, policyname
    from pg_policies
    where schemaname = 'public'
      and tablename in ('site_settings','vehicles','testimonials','offers','enquiries','activity_log','portal_owners')
  loop
    execute format('drop policy %I on %I.%I', r.policyname, r.schemaname, r.tablename);
  end loop;
end $$;

create policy "owner reads own membership" on public.portal_owners

create policy "owner manages vehicles"     on public.vehicles      for all to authenticated using (public.is_owner()) with check (public.is_owner());
create policy "owner manages testimonials" on public.testimonials  for all to authenticated using (public.is_owner()) with check (public.is_owner());

const Modules = {

  /* ---------- vehicles ------------------------------------------- */
  filterVehicles(all,s){
    let list = all.slice();
    if(s.tab==='archived') list = list.filter(v=>v.archived);
    else{
      list = list.filter(v=>!v.archived);
      if(s.tab==='available') list = list.filter(v=>!v.sold && !v.reserved);
      if(s.tab==='featured') list = list.filter(v=>v.featured);
      if(s.tab==='reserved') list = list.filter(v=>v.reserved && !v.sold);
      if(s.tab==='sold') list = list.filter(v=>v.sold);
    }
    if(s.brand) list = list.filter(v=>v.brand===s.brand);
    if(s.q){
      const q = s.q.toLowerCase();
      list = list.filter(v=>[v.name,v.brand,v.model,v.stock,v.vin,v.colour,String(v.year)].join(' ').toLowerCase().indexOf(q)>=0);
    }
    const by = {
      'newest':(a,b)=>b.createdAt-a.createdAt,
      'oldest':(a,b)=>a.createdAt-b.createdAt,
      'price-hi':(a,b)=>b.price-a.price,
      'price-lo':(a,b)=>a.price-b.price,
      'km-lo':(a,b)=>a.mileage-b.mileage,
      'year-hi':(a,b)=>b.year-a.year,
      'views':(a,b)=>(b.views||0)-(a.views||0),
      'name':(a,b)=>String(a.name).localeCompare(String(b.name))
    };
    return list.sort(by[s.sort]||by.newest);
  },

  vehicleCard(v){
    const img = v.images && v.images[0];
    return `<article class="veh ${v.sold?'sold':''}" data-vopen="${v.id}" style="cursor:pointer">
      <div class="veh-img">
        ${img?`<img src="${img}" alt="${U.esc(v.name)}" loading="lazy">`
             :`<div class="none">${ICON.image}<span>No photos yet</span></div>`}
        <div class="veh-tags">
          ${v.demo?`<span class="chip dan" title="Placeholder content, not real"><i></i>Sample</span>`:''}
          ${v.featured?`<span class="chip acc"><i></i>Featured</span>`:''}
          ${v.reserved&&!v.sold?`<span class="chip warn"><i></i>Reserved</span>`:''}
          ${v.archived?`<span class="chip"><i></i>Archived</span>`:''}
        </div>
        ${v.images&&v.images.length?`<span class="veh-count">${ICON.image} ${v.images.length}</span>`:''}
        ${v.sold?`<div class="sold-stamp"><b>SOLD</b></div>`:''}
      </div>
      <div class="veh-b">
        <div class="veh-name">${U.esc(v.name)}</div>
        <div class="veh-meta">${v.year} · ${U.esc(v.colour||v.body||'')} · Stock ${U.esc(v.stock||'not set')}</div>
        <div class="veh-price">${U.money(v.price)}
          ${v.installment?`<small>From ${U.money(v.installment)} per month</small>`:''}
        </div>
        <div class="veh-specs">
          <div class="veh-spec">${ICON.gauge}${U.km(v.mileage)}</div>
          <div class="veh-spec">${ICON.gear2}${U.esc(v.transmission||'')}</div>
          <div class="veh-spec">${ICON.fuel}${U.esc(v.fuel||'')}</div>
          <div class="veh-spec">${ICON.eye}${U.num(v.views||0)} views</div>
        </div>
      </div>
      <div class="veh-acts">
        <button class="btn btn-sm" data-vact="edit" data-id="${v.id}">${ICON.edit} Edit</button>
        ${v.archived
          ? `<button class="btn btn-sm btn-ok" data-vact="unarchive" data-id="${v.id}">${ICON.refresh} Restore</button>`
          : `<button class="btn btn-sm ${v.sold?'btn-warn':'btn-ok'}" data-vact="sold" data-id="${v.id}">${v.sold?ICON.refresh+' Unsold':ICON.check+' Sold'}</button>`}
        <button class="btn btn-sm btn-icon" data-vact="menu" data-id="${v.id}" title="More actions">${ICON.grip}</button>
      </div>
    </article>`;
  },

  repaintVehicles(){
    const mod = Portal.byId.vehicles;
    const root = U.el('#view');
    const list = Modules.filterVehicles(Store.list('vehicles'),mod.state);
    const grid = U.el('.veh-grid',root);
    if(!grid) return Router.refresh();
    if(!list.length) return Router.refresh();
    grid.innerHTML = list.map(Modules.vehicleCard).join('');
    UI.animateAll(grid);
  },

  async vehicleAction(act,id){
    const v = Store.find('vehicles',id);
    if(!v) return;
    if(act==='edit') return Modules.vehicleForm(id);

    if(act==='menu') return Modules.vehicleMenu(v);

    if(act==='sold'){
      const now = !v.sold;
      Store.update('vehicles',id,{sold:now,status:now?'sold':'available',reserved:now?false:v.reserved,featured:now?false:v.featured});
      Store.log(now?'Vehicle marked as sold':'Vehicle back in stock',v.name,'checkCircle',now?'ok':'acc');
      Store.persist(true); Router.refresh();
      UI.toast('ok',now?'Marked as sold':'Back on the website',v.name);
    }
    if(act==='reserve'){
      Store.update('vehicles',id,{reserved:!v.reserved});
      Store.log(!v.reserved?'Vehicle reserved':'Reservation removed',v.name,'reserve','warn');
      Router.refresh(); UI.toast('ok',!v.reserved?'Vehicle reserved':'Reservation removed',v.name);
    }
    if(act==='feature'){
      Store.update('vehicles',id,{featured:!v.featured});
      Store.log(!v.featured?'Vehicle featured':'Vehicle unfeatured',v.name,'star');
      Router.refresh(); UI.toast('ok',!v.featured?'Added to featured':'Removed from featured',v.name);
    }
    if(act==='dup'){
      const copy = Object.assign({},v,{
        id:U.id('v'), name:v.name+' (copy)', stock:(v.stock||'SA')+'-C', sold:false, reserved:false,
        featured:false, archived:false, status:'available', views:0, createdAt:Date.now(), images:v.images.slice(), features:v.features.slice()
      });
      Store.insert('vehicles',copy);
      Store.log('Vehicle duplicated',copy.name,'copy');
      Router.refresh(); UI.toast('ok','Vehicle duplicated','Edit the copy and update its details');
    }
    if(act==='archive'){
      Store.update('vehicles',id,{archived:true,featured:false});
      Store.log('Vehicle archived',v.name+' was hidden from the website','archive','warn');
      Router.refresh(); UI.toast('ok','Vehicle archived','It is hidden from your website but not deleted');
    }
    if(act==='unarchive'){
      Store.update('vehicles',id,{archived:false});
      Store.log('Vehicle restored',v.name+' is back on the website','refresh','ok');
      Router.refresh(); UI.toast('ok','Vehicle restored','');
    }
    if(act==='del'){
      if(await UI.confirm({title:'Delete this vehicle?',message:v.name+' and all of its photos will be permanently removed. Archive it instead if you only want to hide it.',confirmText:'Delete vehicle'})){
        Store.remove('vehicles',id);
        Store.log('Vehicle deleted',v.name,'trash','dan');
        Router.refresh(); UI.toast('ok','Vehicle deleted','');
      }
    }
  },

  vehicleMenu(v){
    const m = UI.modal({
      size:'sm', title:v.name, sub:'Choose an action', autofocus:false, footer:false,

  vehicleForm(id){
    const editing = !!id;
    const v = editing ? Object.assign({},Store.find('vehicles',id)) : {
      name:'', brand:'', model:'', year:new Date().getFullYear(), mileage:0, transmission:'Manual', fuel:'Petrol',
      price:0, installment:0, description:'', features:[], condition:'Excellent', body:'Hatchback', colour:'',
      engine:'', power:'', vin:'', stock:'', status:'available', featured:false, sold:false, reserved:false,
      archived:false, images:[], views:0
    };
    if(!v.features) v.features = [];
    if(!v.images) v.images = [];
    const draft = Object.assign({},v);
    let tab = 'details';

    const body = `
      <div class="tabs" data-vtabs>
        <button data-vt="details" class="on">Vehicle details</button>
        <button data-vt="pricing">Pricing</button>
        <button data-vt="images">Photos <span class="n" data-imgc>${draft.images.length}</span></button>
        <button data-vt="content">Description</button>
        <button data-vt="status">Status</button>
      </div>
      <div data-vpanel></div>`;

    const m = UI.modal({
      size:'lg',
      title: editing ? 'Edit vehicle' : 'Add a new vehicle',
      sub: editing ? 'Changes appear on your website as soon as you save.' : 'Fill in what you know. You can always come back and add more.',
      body,
      footer:`<button class="btn" data-close>Cancel</button>
              <div class="sp">
                ${editing?`<button class="btn btn-dan" data-vdel>${ICON.trash} Delete</button>`:''}
                <button class="btn btn-pri" data-vsave>${ICON.check} ${editing?'Save changes':'Add vehicle'}</button>
              </div>`
    });

    const panel = U.el('[data-vpanel]',m.el);

    function paint(){
      if(tab==='details'){
        panel.innerHTML = `
          <div class="grid g2">
            ${H.field('Vehicle name',H.input('name',draft.name,'BMW 320d M Sport'),'This is the heading shown on your website.')}
            ${H.field('Stock number',H.input('stock',draft.stock,'SA-1042'))}
            ${H.field('Brand',H.sel('brand',draft.brand,[{v:'',l:'Choose a brand'}].concat(BRANDS)))}
            ${H.field('Model',H.input('model',draft.model,'320d M Sport'))}
            ${H.field('Year',`<input class="inp" data-k="year" type="number" min="1970" max="${new Date().getFullYear()+1}" value="${draft.year}">`)}
            ${H.field('Mileage in km',`<input class="inp" data-k="mileage" type="number" min="0" value="${draft.mileage}">`)}
            ${H.field('Transmission',H.sel('transmission',draft.transmission,TRANS))}
            ${H.field('Fuel type',H.sel('fuel',draft.fuel,FUELS))}
            ${H.field('Body type',H.sel('body',draft.body,BODIES))}
            ${H.field('Colour',H.input('colour',draft.colour,'Alpine White'))}
            ${H.field('Engine',H.input('engine',draft.engine,'2.0L Turbo Diesel'))}
            ${H.field('Power',H.input('power',draft.power,'140 kW'))}
            ${H.field('Condition',H.sel('condition',draft.condition,CONDS))}
            ${H.field('VIN number',H.input('vin',draft.vin,'Optional'),'Not shown publicly. For your records only.','optional')}
          </div>`;
      }
      if(tab==='pricing'){
        panel.innerHTML = `
          <div class="grid g2">
            ${H.field('Selling price in rand',`<input class="inp" data-k="price" type="number" min="0" step="500" value="${draft.price}">`,'Shown as '+U.money(draft.price))}
            ${H.field('Monthly installment in rand',`<input class="inp" data-k="installment" type="number" min="0" step="50" value="${draft.installment}">`,'Shown as From '+U.money(draft.installment)+' per month')}
          </div>
          <div class="sep"></div>
          <div class="grid" style="gap:12px">
            <button class="btn" data-calc>${ICON.money} Work out the installment for me</button>
            <div class="note">${ICON.info}<div>The calculator uses a 60 month term at 12.75 percent with a 10 percent deposit. Always confirm the final figure with your finance house before advertising it.</div></div>
            <div class="card" style="box-shadow:none;background:var(--glass)"><div class="card-b">
              <div class="kv">
                <div class="kv-row"><span>Selling price</span><b>${U.money(draft.price)}</b></div>
                <div class="kv-row"><span>Suggested deposit at 10 percent</span><b>${U.money(draft.price*0.1)}</b></div>
                <div class="kv-row"><span>Advertised installment</span><b>${draft.installment?U.money(draft.installment)+' per month':'Not set'}</b></div>
              </div>
            </div></div>
          </div>`;
        U.el('[data-calc]',panel).addEventListener('click',()=>{
          const principal = draft.price*0.9, r = 0.1275/12, n = 60;
          draft.installment = Math.round((principal*r)/(1-Math.pow(1+r,-n))/10)*10;
          paint(); UI.toast('ok','Installment calculated',U.money(draft.installment)+' per month');
        });
      }
      if(tab==='images'){
        panel.innerHTML = `
          <div class="grid" style="gap:14px">
            <div class="note">${ICON.info}<div>Add up to 5 photos. The first photo is the main image on your website, so make it the best exterior shot. Drag any photo to change the order.</div></div>
            <div id="vUp"></div>
          </div>`;
        UI.uploader(U.el('#vUp',panel),{
          max:5, images:draft.images, bucket:'vehicle-images', label:'Drop vehicle photos here or tap to browse',
          hint:'Landscape photos look best.',
          onChange:imgs=>{ draft.images = imgs; const c=U.el('[data-imgc]',m.el); if(c) c.textContent = imgs.length; }
        });
      }
      if(tab==='content'){
        panel.innerHTML = `
          <div class="grid" style="gap:16px">
            ${H.field('Description',H.ta('description',draft.description,'Describe the vehicle, its history and what makes it a good buy.',7),'Mention the service history, condition and any extras. Buyers read this before they call.')}
            ${H.field('Features',`<div id="vFeat"></div>`,'Type a feature and press Enter. These show as a tick list on your website.')}
            <div class="row">
              <button class="btn btn-sm" data-quick="Full service history">Add service history</button>
              <button class="btn btn-sm" data-quick="Accident free">Add accident free</button>
              <button class="btn btn-sm" data-quick="One owner from new">Add one owner</button>
              <button class="btn btn-sm" data-quick="Balance of factory warranty">Add warranty</button>
            </div>
          </div>`;
        const tg = UI.tags(U.el('#vFeat',panel),draft.features,list=>draft.features=list);
        U.on(panel,'click','[data-quick]',(e,b)=>{
          const val = b.dataset.quick;
          if(draft.features.indexOf(val)<0){ draft.features.push(val); tg.get(); paint(); }
          else UI.toast('warn','Already added',val+' is already on the list.');
        });
      }
      if(tab==='status'){
        panel.innerHTML = `
          <div class="grid" style="gap:11px">
            ${H.toggleCard('featured',draft.featured,'Featured vehicle','Show this vehicle on your homepage','','star')}
            ${H.toggleCard('reserved',draft.reserved,'Reserved','Shows a reserved badge and stops new enquiries','warn','reserve')}
            ${H.toggleCard('sold',draft.sold,'Sold','Marks the vehicle sold and removes it from the available list','ok','checkCircle')}
            ${H.toggleCard('archived',draft.archived,'Archived','Hides the vehicle from your website completely','','archive')}
            <div class="sep"></div>
            ${H.field('Vehicle views',`<input class="inp" data-k="views" type="number" min="0" value="${draft.views||0}">`,'Shown on the vehicle card and the dashboard. Reset it to zero if you relist the vehicle.')}
          </div>`;
      }
      H.bind(panel,(k,val)=>{
        draft[k] = ['year','mileage','price','installment','views'].indexOf(k)>=0 ? Number(val)||0 : val;
        if(k==='brand' || k==='model'){
          if(!editing && !draft.name && draft.brand && draft.model) {
            const n = U.el('[data-k="name"]',panel);
            draft.name = draft.brand+' '+draft.model;
            if(n) n.value = draft.name;
          }
        }
      },()=>{});
    }

    U.on(m.el,'click','[data-vt]',(e,b)=>{
      tab = b.dataset.vt;
      U.els('[data-vt]',m.el).forEach(x=>x.classList.toggle('on',x.dataset.vt===tab));
      paint();
    });

    UI.once(U.el('[data-vsave]',m.el),()=>{
      if(!draft.name.trim() && !(draft.brand && draft.model)){
        tab='details';
        U.els('[data-vt]',m.el).forEach(x=>x.classList.toggle('on',x.dataset.vt==='details'));
        paint();
        return UI.toast('err','A name is needed','Give the vehicle a name, or choose a brand and model.');
      }
      if(!draft.name.trim()) draft.name = (draft.brand+' '+draft.model).trim();
      draft.status = draft.sold ? 'sold' : draft.reserved ? 'reserved' : 'available';
      if(editing){
        Store.update('vehicles',id,draft);
        Store.log('Vehicle updated',draft.name+' details were edited','edit');
      }else{
        Store.insert('vehicles',draft);
        Store.log('Vehicle added',draft.name+' was listed at '+U.money(draft.price),'car','ok');
      }
      Store.persist(true);
      m.close();
      Router.refresh();
      UI.toast('ok',editing?'Vehicle saved':'Vehicle added to your website',draft.name);
    });

    const del = U.el('[data-vdel]',m.el);
    if(del) UI.once(del,async()=>{
      if(await UI.confirm({title:'Delete this vehicle?',message:draft.name+' and all of its photos will be permanently removed.',confirmText:'Delete vehicle'})){
        Store.remove('vehicles',id);
        Store.log('Vehicle deleted',draft.name,'trash','dan');
        m.close(); Router.refresh(); UI.toast('ok','Vehicle deleted','');
      }
    });

    paint();
  },

const Router = {
  current:null,

  buildNav(){
    const groups = [];
    Portal.modules.forEach(m=>{
      const g = m.group||'General';
      let grp = groups.find(x=>x.name===g);
      if(!grp){ grp={name:g,items:[]}; groups.push(grp); }
      grp.items.push(m);
    });
    /* Same reason as #view in go(): buildNav() runs again after a restore,
       a database pull or a re-login, and #sbNav is permanent. Swap it for a
       clone so the previous click handler goes with it. */
    const oldNav = U.el('#sbNav');
    const nav = oldNav.cloneNode(false);
    oldNav.parentNode.replaceChild(nav, oldNav);
    nav.innerHTML = groups.map(g=>`
      <div class="sb-group">${U.esc(g.name)}</div>
      ${g.items.map(m=>`
        <button class="sb-link" data-nav="${m.id}">
          ${ICON[m.icon]||ICON.dash}
          <span>${U.esc(m.title)}</span>
          <span data-badge="${m.id}"></span>
        </button>`).join('')}
    `).join('');
    U.on(nav,'click','[data-nav]',(e,b)=>{
      location.hash = '#/'+b.dataset.nav;
      Shell.closeSidebar();
    });
    this.paintBadges();
  },

  paintBadges(){
    const st = Store.stats();
    Portal.modules.forEach(m=>{
      const slot = U.el(`[data-badge="${m.id}"]`);
      if(!slot) return;
      const b = m.badge ? m.badge(st) : null;
      slot.outerHTML = b
        ? `<span class="sb-badge ${b.mut?'mut':''}" data-badge="${m.id}">${U.esc(b.text)}</span>`
        : `<span data-badge="${m.id}"></span>`;
    });
    const bell = U.el('#bellDot');
    if(bell) bell.style.display = st.unread ? 'block' : 'none';
  },

  go(id,params){
    const mod = Portal.byId[id] || Portal.modules[0];
    this.current = mod.id;
    U.els('.sb-link').forEach(b=>b.classList.toggle('on',b.dataset.nav===mod.id));
    U.el('#tbTitle').innerHTML = `${U.esc(mod.title)}<small>${U.esc(mod.sub||'')}</small>`;
    /* Swap #view for a shallow clone before every render. Modules bind
       delegated listeners to this node in mount(), and mount() runs again on
       every navigation and every refresh. Reusing the node stacked a fresh
       set of listeners each time, so after N renders a single click fired
       its handler N times and opened N identical dialogs. Replacing the node
       discards the old listeners along with it. */
    let view = U.el('#view');
    const freshView = view.cloneNode(false);
    view.parentNode.replaceChild(freshView, view);
    view = freshView;
    view.classList.remove('anim');
    view.innerHTML = UI.skeleton(mod.skeleton||'list',5);
    document.title = mod.title+' · Supreme Auto Portal';
    setTimeout(()=>{
      view.innerHTML = mod.render(params||{});
      void view.offsetWidth;
      view.classList.add('anim');
      if(mod.mount) mod.mount(view,params||{});
      UI.animateAll(view);
      Router.paintBadges();
      window.scrollTo({top:0,behavior:'instant'});
    }, mod.instant?0:150);
  },

  refresh(){ if(this.current) this.go(this.current); },

  start(){
    const read = ()=>{
      const h = (location.hash||'').replace(/^#\/?/,'');
      const [id,q] = h.split('?');
      const params = {};
      (q||'').split('&').filter(Boolean).forEach(p=>{
        const [k,v]=p.split('='); params[decodeURIComponent(k)]=decodeURIComponent(v||'');
      });
      this.go(id||'dashboard',params);
    };
    window.addEventListener('hashchange',read);
    read();
  }
};

const Shell = {
  openSidebar(){ U.el('#sidebar').classList.add('on'); U.el('#scrim').classList.add('on'); },
  closeSidebar(){ U.el('#sidebar').classList.remove('on'); U.el('#scrim').classList.remove('on'); },
  applyTheme(){
    const a = Store.data.appearance;
    document.documentElement.style.setProperty('--accent',a.accent||'#0A84FF');
    document.documentElement.style.setProperty('--accent-glow',(a.accent||'#0A84FF')+'6B');
    document.documentElement.style.setProperty('--accent-soft',(a.accent||'#0A84FF')+'24');
    document.documentElement.style.setProperty('--success',a.success||'#10B981');
  },
  login(){
    if(!Cloud.authed) return Shell.lock();      /* never open the portal unauthenticated */
    U.el('#login').classList.add('hide');
    U.el('#app').classList.add('on');
    Router.buildNav();
    Router.start();
    Shell.paintStatus();
    U.el('.sb-user b').textContent = Cloud.email.split('@')[0] || 'Owner';
    U.el('.sb-user small').textContent = Cloud.email || 'Signed in';
    /* send anything queued, then load the latest content from the database */
    if(Cloud.authed){
      Cloud.flush()
        .then(()=>Cloud.pullAll())
        .then(res=>{
          if(res && res.blocked){
            Modules.ownerHelp();
            return;
          }
          if(res && res.empty){
            UI.toast('warn','Your database is empty','Open Database and push your content to fill it');
            return;
          }
          Shell.applyTheme(); Router.refresh();
          UI.toast('ok','Loaded from database','Your content is up to date');
        })
        .catch(err=>{
          Cloud.setStatus('offline',err.message);
          UI.toast('warn','Working offline','Showing the last copy saved on this device');
        });
    }
  },
  async logout(){
    const btn = U.el('#btnLogout');
    /* The icon has to be put back. Sign out ends on the login screen, but the
       sidebar button survives it, so signing back in used to show a refresh
       icon where the sign-out icon belongs until a full page reload. The
       guard stops a second click firing a second revoke. */
    if(Shell._loggingOut) return;
    Shell._loggingOut = true;
    const mark = btn ? btn.innerHTML : '';
    if(btn){ btn.innerHTML = ICON.refresh; btn.disabled = true; }
    try{
      await Cloud.signOut();                     /* revokes the token server side */
    }finally{
      if(btn){ btn.innerHTML = mark; btn.disabled = false; }
      Shell._loggingOut = false;
    }
    Shell.lock();
  },

  /* Shows the login screen and closes the portal behind it. */
  lock(message){
    U.el('#app').classList.remove('on');
    U.el('#login').classList.remove('hide');
    const p = U.el('#loginPass'); if(p) p.value='';
    U.el('#loginErr').textContent = message || '';
    Shell.paintLogin();
  },

  paintLogin(){
    const em = (Cloud.session && Cloud.session.email) || Shell.lastEmail || '';
    if(em) U.el('#loginEmail').value = em;
    U.el('#loginHint').innerHTML = 'Secured by Supabase Authentication.';
  },

  paintStatus(){
    const pill = U.el('#syncPill');
    if(!pill) return;
    const s = Cloud.status;
    const cls = s==='online'?'':s==='syncing'?'acc':s==='offline'?'warn':'dan';
    const txt = s==='online'?'Synced':s==='syncing'?'Syncing':s==='offline'?'Offline':'Sign in needed';
    const title = Cloud.statusLabel()+(Cloud.queue.length?' ('+Cloud.queue.length+' waiting)':'')+(Cloud.lastError?'. '+Cloud.lastError:'');
    pill.className = 'live '+cls;
    pill.title = title;
    U.el('span',pill).textContent = txt;
  },
  init(){
    Shell.applyTheme();
    U.el('#burger').addEventListener('click',Shell.openSidebar);
    U.el('#scrim').addEventListener('click',Shell.closeSidebar);
    U.el('#btnLogout').addEventListener('click',async()=>{
      const pending = Cloud.queue.length;
      const msg = pending
        ? pending+' change'+(pending===1?'':'s')+' have not reached the database yet. Signing out now keeps them queued on this device until you sign back in.'
        : 'Everything is saved to your database. You will need your email and password to sign back in.';
      if(await UI.confirm({title:'Sign out?',message:msg,confirmText:'Sign out',tone:'warn'})) Shell.logout();
    });
    U.el('#btnPreview').addEventListener('click',()=>window.open('https://supremeautonorth.co.za/','_blank','noopener'));
    U.el('#btnBell').addEventListener('click',()=>Modules.notifications());

    /* The only way into the portal: Supabase Authentication. This posts to
       /auth/v1/token?grant_type=password, which is exactly what the SDK's
       signInWithPassword() calls. No SDK, so the portal stays one file. */
    U.el('#loginForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const err = U.el('#loginErr');
      const btn = U.el('#loginBtn');
      const email = U.el('#loginEmail').value.trim();
      const pass = U.el('#loginPass').value;

      if(!email) return err.textContent = 'Enter your email address.';
      if(!pass) return err.textContent = 'Enter your password.';

      btn.disabled = true; btn.textContent = 'Signing in...'; err.textContent = '';
      try{
        await Cloud.signIn(email,pass);
        Shell.lastEmail = email;
        Shell.login();
        setTimeout(()=>UI.toast('ok','Signed in',email),500);
      }catch(ex){
        err.textContent =
          /invalid|credential|grant/i.test(ex.message) ? 'That email and password do not match an account. Check for typos, or reset your password below.'
          : /confirm/i.test(ex.message) ? 'That account has not been confirmed yet. In Supabase, open Authentication, Users, and confirm it.'
          : /connection|internet/i.test(ex.message) ? 'Cannot reach the database. Check your internet and try again.'
          : ex.message;
        U.el('#loginPass').select();
      }finally{
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });

    U.el('#loginForgot').addEventListener('click',async()=>{
      const email = U.el('#loginEmail').value.trim();
      const err = U.el('#loginErr');
      if(!email) return err.textContent = 'Enter your email address first, then tap Forgot your password.';
      try{
        await Cloud.sendReset(email);
        err.textContent = '';
        UI.toast('ok','Reset email sent','Check '+email+' for a link to set a new password');
      }catch(ex){ err.textContent = ex.message; }
    });

    U.el('#syncPill').addEventListener('click',()=>{
      if(!Cloud.on) return location.hash = '#/database';
      if(Cloud.queue.length){ Cloud.flush(); UI.toast('info','Syncing now',Cloud.queue.length+' changes waiting'); }
      else location.hash = '#/database';
    });
    Shell.paintLogin();

    const gs = U.el('#globalSearch');
    document.addEventListener('keydown',e=>{
      if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
        e.preventDefault(); gs.focus();
      }
    });
    gs.addEventListener('keydown',e=>{
      if(e.key==='Enter' && gs.value.trim()){
        location.hash = '#/vehicles?q='+encodeURIComponent(gs.value.trim());
        gs.blur();
      }
    });

    Store.on('*',()=>Router.paintBadges());
  }
};

/* ==================================================================
   BOOT
   ================================================================== */
Cloud.init();      /* must run before the store, which mirrors writes to it */
Store.init();
Shell.init();

(function boot(){
  const bar = U.el('#bootBar');
  let p = 0;
  const t = setInterval(()=>{
    p = Math.min(100, p + 14 + Math.random()*20);
    bar.style.width = p+'%';
    if(p>=100){
      clearInterval(t);
      setTimeout(()=>{
        U.el('#boot').classList.add('done');
        /* A stored Supabase session reopens the portal straight away and
           survives a refresh. No session means the login screen, always. */
        if(Cloud.authed){
          Shell.login();
          /* renew the token if this session has been sitting for a while */
          if(Date.now() - (Cloud.session.at||0) > 40*60*1000) Cloud.refresh();
        }else{
          Shell.paintLogin();
          U.el('#login').classList.remove('hide');
        }
      },260);
    }
  },130);
})();

/* expose for console debugging and future integrations */
window.SupremeAuto = { Store, Portal, Router, UI, U, DB, Cloud, Assets, Modules, MAP, SCHEMA_SQL };

})();
</script>
